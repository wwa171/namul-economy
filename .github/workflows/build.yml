name: Build and Release Plugin

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 9.0 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Download and Extract TShock Binary Dependencies
      shell: powershell
      run: |
        New-Item -ItemType Directory -Path lib -Force
        curl.exe -L -o tshock.zip "https://github.com/Pryaxis/TShock/releases/download/v6.2.1/TShock-6.2.1-for-Terraria-1.4.5.8-win-x64-Release.zip"
        Expand-Archive -Path tshock.zip -DestinationPath extracted -Force
        Copy-Item extracted/ServerPlugins/TShockAPI.dll lib/ -Force
        Copy-Item extracted/bin/TerrariaServer.dll lib/ -Force
        Copy-Item extracted/bin/OTAPI.dll lib/ -Force
        Copy-Item extracted/bin/ModFramework.dll lib/ -Force
        Remove-Item tshock.zip -Force
        Remove-Item extracted -Recurse -Force

    - name: Build TShock Plugin DLL
      run: |
        dotnet build TShockEconomyExp.csproj -c Release

    - name: Run Automated Unit Tests (xUnit)
      run: |
        dotnet test TShockEconomyExp.Tests/TShockEconomyExp.Tests.csproj -c Release

    - name: Publish Lightweight GUI Config Tool
      run: |
        dotnet publish NamulRpgConfigTool/NamulRpgConfigTool.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true

    - name: Archive Built Artifacts
      shell: powershell
      run: |
        New-Item -ItemType Directory -Path build_output -Force
        Copy-Item bin/Release/net9.0/TShockEconomyExp.dll build_output/ -Force
        Copy-Item NamulRpgConfigTool/bin/Release/net9.0-windows/win-x64/publish/NamulRpgConfigTool.exe build_output/ -Force

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Namul-RPG-Build-Output
        path: build_output/

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "Namul RPG Core Latest Release"
        body: |
          🚀 **최신 TShock RPG Core (namul-economy) 자동 빌드 배포본**
          - **커밋**: `${{ github.sha }}`
          - **커밋 메시지**: `${{ github.event.head_commit.message }}`
          - **빌드 일자**: `${{ github.event.head_commit.timestamp }}`

          ---
          ### 📦 빌드 산출물 목록
          - `TShockEconomyExp.dll` : 최신 TShock 서버 플러그인 바이너리 (TShock `ServerPlugins/` 적용)
          - `NamulRpgConfigTool.exe` : 다국어 지원 경량 GUI 설정 편집기

          ---
          ### 🌟 최신 주요 기능 및 업데이트
          - **👑 보스 스케일링 & 소환 통제 (`BossScaling`)**
            - 서버 자연 발생 보스 스폰 차단 (`BlockNaturalBossSpawn`)
            - 소환자 레벨 비례 보스 체력 증폭 (`체력 + (체력 * 레벨 * HealthIncreasePerLevel)`)
            - 보스 소환 아이템 레벨별 사용 제한 (`BossItemLevelRequirements`)
          - **🌾 채광 어뷰징 방지**: 플레이어 설치 블록 실시간 추적 및 보상 제외
          - **🎣 낚시 어뷰징 방지**: 낚싯대 소지 검증, 활성 찌(Bobber) 물속 좌표 정밀 일치 검증(타인 양도 원천 차단) 및 초고속 매크로/핵 연타 방지 쿨타임 검증
          - **⚡ 전투 패킷 최적화**: 다단히트 무기 렉 방지를 위한 CombatText 스로틀링
          - **🛡️ 장비별 레벨 제한 (`ItemRequirements`)**: 초반 장비(Lv.1~)부터 던전, 하드모드, 엔드게임 제니스(Lv.90)까지 슬롯 및 손에 든 아이템 레벨 검증 & 차단
          - **🔥 마스터모드 특화 밸런스 (`MasterBalance`)**: 고난도 보상 경험치/골드 +50% 증가 및 방어력 감쇄 최적화
          - **🏛️ 실시간 서버 경매장 (`/경매장`, `/경매`)**: 유저 간 아이템 위탁 판매 및 실시간 인벤토리/골드 동기화 구매 시스템
          - **💎 장비 드롭 시 무작위 스탯/접두사(Affix) 룰렛**: 몬스터/보스 파밍 시 무작위 접두사 자동 부여
          - **⚔️ 레벨 단계별 직업 특화 심화 패시브**: Lv.30, Lv.60 달성 시 4대 직업별 고유 고급 전투 버프 자동 개방
          - **🗡️ 4대 직업 스탯**: 워리어/레인저/소서러/서머너 특화 스탯 시스템 및 상시 패시브 버프
        files: |
          build_output/TShockEconomyExp.dll
          build_output/NamulRpgConfigTool.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
